<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Электронный дневник</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; padding:20px; }
    h1 { color:#333; }
    form { margin-bottom:20px; }
    input { padding:8px; margin-right:10px; }
    button { padding:8px 12px; }
    table { border-collapse: collapse; width: 100%; background:#fff; }
    th, td { border:1px solid #ccc; padding:8px; text-align:left; }
    th { background:#eee; }
  </style>
</head>
<body>
  <h1>Электронный дневник</h1>

  <form id="gradeForm">
    <input id="user" placeholder="Имя ученика" required />
    <input id="grade" type="number" min="1" max="10" placeholder="Оценка" required />
    <button type="submit">Добавить</button>
  </form>

  <button onclick="loadGrades()">Обновить список</button>

  <table>
    <thead>
      <tr>
        <th>Ученик</th>
        <th>Оценки</th>
        <th>Средний балл</th>
      </tr>
    </thead>
    <tbody id="gradesBody"></tbody>
  </table>

<script>
const token = "ghp_ТВОЙ_ТОКЕН_СЮДА"; 
const gistId = "ce3a5b40573fc8a043b8e6f3ccfa0b45"; // твой Gist ID
const fileName = "grades.json";

// Загрузка оценок
async function loadGrades() {
  const res = await fetch(`https://api.github.com/gists/${gistId}`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  const data = await res.json();
  const content = JSON.parse(data.files[fileName].content);
  render(content);
}

// Сохранение оценки
async function saveGrade(user, grade) {
  const res = await fetch(`https://api.github.com/gists/${gistId}`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  const gist = await res.json();
  const content = JSON.parse(gist.files[fileName].content);

  if (!content[user]) content[user] = [];
  content[user].push(grade);

  await fetch(`https://api.github.com/gists/${gistId}`, {
    method: "PATCH",
    headers: {
      Authorization: `Bearer ${token}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      files: { [fileName]: { content: JSON.stringify(content, null, 2) } }
    })
  });

  loadGrades();
}

// Отображение таблицы
function render(data) {
  const body = document.getElementById("gradesBody");
  body.innerHTML = "";
  for (const [user, grades] of Object.entries(data)) {
    const tr = document.createElement("tr");
    const avg = (grades.reduce((a,b)=>a+b,0) / grades.length).toFixed(2);
    tr.innerHTML = `
      <td>${user}</td>
      <td>${grades.join(", ")}</td>
      <td>${avg}</td>
    `;
    body.appendChild(tr);
  }
}

// Обработчик формы
document.getElementById("gradeForm").addEventListener("submit", e => {
  e.preventDefault();
  const user = document.getElementById("user").value.trim();
  const grade = parseInt(document.getElementById("grade").value, 10);
  if (user && grade) saveGrade(user, grade);
});

// При загрузке страницы
loadGrades();
</script>
</body>
</html>
